<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">Using light-level geolocators to monitor incubation behaviour of a cavity-nesting bird Apus apus pekinensis</title>
  <desc id="desc">Stylized cover with violet gradient and title text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />
  <rect x="40" y="40" width="520" height="720" rx="28" fill="#ffffff" opacity="0.92" />
  <text x="80" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700">Avian Research</text>
  <text x="80" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="600">
    <tspan x="80" dy="0">Using light-level</tspan>
    <tspan x="80" dy="30">geolocators to monitor</tspan>
    <tspan x="80" dy="30">incubation behaviour</tspan>
  </text>
  <text x="80" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#334155">Huang, Zhao &amp; Liu</text>
  <text x="80" y="680" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#6d28d9">2021</text>
</svg>
