  </text>
  <text x="80" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#334155">Chen, Antonelli, Huang et al.</text>
  <text x="80" y="680" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#b45309">2025</text>
